name: Website CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    # Ephemeral database only; production Supabase is never used by CI.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: baribudos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d baribudos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/baribudos
      DIRECT_URL: postgresql://user:password@localhost:5432/baribudos
      NEXT_PUBLIC_SITE_URL: https://example.com
      STUDIO_PUBLISH_API_KEY: ci-studio-key
      ADMIN_PANEL_KEY: ci-admin-key
      STRIPE_SECRET_KEY: stripe-secret-placeholder
      STRIPE_WEBHOOK_SECRET: stripe-webhook-placeholder
      PAYPAL_CLIENT_ID: paypal-client-placeholder
      PAYPAL_CLIENT_SECRET: paypal-secret-placeholder
      PAYPAL_MODE: sandbox
      LIBRARY_TOKEN_SECRET: ci-library-secret
      AUTH_COOKIE_NAME: baribudos_session
      AUTH_JWT_SECRET: ci-auth-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Secret hygiene
        run: node ./scripts/check-secret-hygiene.mjs

      - name: Prisma generate
        run: npx prisma generate

      - name: Prepare isolated PostgreSQL schema
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: PostgreSQL integration tests
        run: npx --yes tsx@4.19.2 --test tests/publication-sync.integration.test.ts

      - name: Build
        run: npm run ci:build
